<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy LaTeX Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
    />
    <!-- latex.js for full document rendering -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/latex.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 2rem;
      }

      #app {
        max-width: 1600px;
        margin: 0 auto;
      }

      /* Restore indentation for definition lists rendered by latex.js */
      dl dd {
        margin-left: 2em;
      }

      /* Fix bullets/indent for latex.js itemize/enumerate lists */
      ul.itemize {
        list-style: disc outside;
        margin-left: 2em;
        padding-left: 0;
      }

      ol.enumerate {
        list-style: decimal outside;
        margin-left: 2em;
        padding-left: 0;
      }

      /* Disable latex.js custom bullets so we only see the normal list marker */
      ul.itemize > li::before,
      ol.enumerate > li::before {
        content: none !important;
      }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/latex.min.js"></script>
    <script>
      // Load and transpile the external JSX file
      fetch('easyLatex.js')
        .then(response => {
          if (!response.ok) {
            throw new Error('HTTP ' + response.status + ': ' + response.statusText);
          }
          return response.text();
        })
        .then(code => {
          const transpiled = Babel.transform(code, {
            presets: ['react']
          }).code;
          eval(transpiled);
        })
        .catch(error => {
          console.error('Error loading easyLatex.js:', error);
          const isFileProtocol = window.location.protocol === 'file:';
          const errorMsg = isFileProtocol 
            ? '<div style="padding: 2rem; color: white; text-align: center; max-width: 600px; margin: 0 auto;"><h1 style="margin-bottom: 1rem;">⚠️ File Protocol Detected</h1><p style="margin-bottom: 1rem; font-size: 1.1rem;">You are opening this file directly. Please use a web server instead.</p><p style="margin-bottom: 1.5rem;"><strong>To fix this:</strong></p><ol style="text-align: left; display: inline-block; margin-bottom: 1.5rem;"><li style="margin-bottom: 0.5rem;">Open Terminal</li><li style="margin-bottom: 0.5rem;">Run: <code style="background: rgba(0,0,0,0.3); padding: 0.2rem 0.5rem; border-radius: 4px;">cd /Users/davidyang438/code/CIS-4120-A5</code></li><li style="margin-bottom: 0.5rem;">Run: <code style="background: rgba(0,0,0,0.3); padding: 0.2rem 0.5rem; border-radius: 4px;">python3 -m http.server 8000</code></li><li style="margin-bottom: 0.5rem;">Open: <a href="http://localhost:8000" style="color: #fbd38d; text-decoration: underline;">http://localhost:8000</a></li></ol><p style="font-size: 0.9rem; opacity: 0.9;">Error details: ' + error.message + '</p></div>'
            : '<div style="padding: 2rem; color: white; text-align: center;"><h1>Error Loading Application</h1><p>Failed to load easyLatex.js</p><p style="font-size: 0.9rem;">Error: ' + error.message + '</p><p style="margin-top: 1rem;">Make sure easyLatex.js is in the same directory as index.html</p></div>';
          document.getElementById('app').innerHTML = errorMsg;
        });
    </script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
