<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy LaTeX Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css"
    />
    <!-- latex.js for full document rendering -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/latex.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 2rem;
      }

      #app {
        max-width: 1600px;
        margin: 0 auto;
      }

      /* Restore indentation for definition lists rendered by latex.js */
      dl dd {
        margin-left: 2em;
      }

      /* Fix bullets/indent for latex.js itemize/enumerate lists */
      ul.itemize {
        list-style: disc outside;
        margin-left: 2em;
        padding-left: 0;
      }

      ol.enumerate {
        list-style: decimal outside;
        margin-left: 2em;
        padding-left: 0;
      }

      /* Disable latex.js custom bullets so we only see the normal list marker */
      ul.itemize > li::before,
      ol.enumerate > li::before {
        content: none !important;
      }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/latex.min.js"></script>
    <script type="text/babel" src="easyLatex.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
